<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Verification Code</title>
  <style>
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; padding: 16px !important; }
      .otp { font-size: 28px !important; letter-spacing: 4px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;">

  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:20px 10px;">
        <table class="container" width="520" cellpadding="0" cellspacing="0" role="presentation" style="width:520px; background:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.08);">
          
          <!-- Header / Logo -->
          <tr>
            <td style="padding:20px; text-align:center; background:#ffffff;">
              <img src="{{LogoURL}}" alt="{{AppName}}" width="120" style="display:block; margin:0 auto 8px;" />
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:28px 32px 20px; color:#0f1724;">
              <h1 style="margin:0 0 10px; font-size:20px; font-weight:600; color:#111827;">Hello {{UserName}},</h1>
              <p style="margin:0 0 18px; line-height:1.5; color:#374151;">
                Your verification code (OTP) is:
              </p>

              <!-- OTP box -->
              <div style="text-align:center; margin:10px 0 18px;">
                <div class="otp" style="display:inline-block; padding:18px 26px; border-radius:8px; background:#f8fafc; border:1px solid #e6eef6; font-size:32px; font-weight:700; letter-spacing:6px; color:#0b5cff;">
                  {{OTP_CODE}}
                </div>
              </div>

              <p style="margin:0 0 12px; color:#6b7280;">
                Please do not share this code with anyone for security reasons.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:18px 32px 26px; background:#fbfdff; color:#94a3b8; font-size:13px;">
              <p style="margin:0 0 8px;">Need help? Contact us at <a href="mailto:{{SupportEmail}}" style="color:#0b5cff; text-decoration:none;">{{SupportEmail}}</a></p>
              <p style="margin:8px 0 0;">Best regards, <br/>The <strong>{{AppName}}</strong> Team</p>
            </td>
          </tr>

        </table>

        <!-- Footer note -->
        <table width="520" cellpadding="0" cellspacing="0" role="presentation" style="width:520px; max-width:520px; margin-top:12px;">
          <tr>
            <td style="text-align:center; font-size:12px; color:#9aa5b1;">
              © {{CurrentYear}} {{AppName}}. All rights reserved.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
